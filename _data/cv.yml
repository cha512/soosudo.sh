intro: >
  I'm a systems security researcher focused on reverse engineering and
  vulnerability research across binaries, firmware, wireless systems, and
  embedded hardware. I often work on undocumented or unsupported targets and
  build the tooling needed to analyze them. I've been active in security
  research and competitions since 2016.

domains:
  - name: Reverse Engineering
    note: binaries, firmware, and complex protocols
  - name: Vulnerability Research
    note: vulnerability discovery and exploit research across Windows and Android
  - name: Wireless Security
    note: cellular-derived PHY-layer analysis and proprietary RF protocol reversing
  - name: Embedded & Hardware Systems
    note: firmware, RTL, and FPGA-based systems

