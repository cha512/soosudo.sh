work:
  - role: Security Research Lead
    org: ENKI WhiteHat
    period: 2020 - present
    notes:
      - Lead technical research across vulnerability discovery, wireless systems, and embedded hardware
      - Conduct private zero-day and exploit research across binaries, firmware, Windows, and Android
      - Build end-to-end research environments for undocumented wireless systems, from raw signal and PHY-layer analysis through protocol-state reconstruction
      - Build FPGA/RTL prototypes around open-source soft-core SoCs and extensively modified digital interface IP to validate hypotheses
      - Participate in cyber defense exercises, including Locked Shields (DFIR), and author challenges for major security competitions

